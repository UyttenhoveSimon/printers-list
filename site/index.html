<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printers List</title>
<meta name="description" content="Every home and small-office printer on sale, filterable by two-sided printing and scanning, technology, functions, connectivity, speed, size, year and country, with their cartridges. Refreshed every week.">
<link rel="preload" href="printers.json" as="fetch" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232f6fde' d='M6 2h12v5H6zM4 8h16a2 2 0 0 1 2 2v7h-4v5H6v-5H2v-7a2 2 0 0 1 2-2zm4 9v3h8v-3z'/%3E%3C/svg%3E">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <h1 data-i18n="title">Printers List</h1>
    <input id="q" type="search" data-i18n-placeholder="search" data-i18n-label="search" autocomplete="off">
    <select id="lang" data-i18n-label="language"></select>
    <button id="toggle-filters" type="button" class="ghost" aria-expanded="false" aria-controls="filters" data-i18n="filters">Filters</button>
  </div>
</header>

<div class="wrap layout">
  <aside id="filters" class="filters" data-i18n-label="filters"></aside>

  <main>
    <div class="bar">
      <p id="count" aria-live="polite"></p>
      <button id="since" type="button" class="ghost small" hidden></button>
      <label class="sort"><span data-i18n="sort">Sort</span> <select id="sort"></select></label>
    </div>
    <div id="active" class="active"></div>
    <ul id="results" class="grid"></ul>
    <nav id="pager" class="pager" aria-label="Pages"></nav>
  </main>
</div>

<div id="tray" class="tray" hidden>
  <div class="wrap tray-row">
    <ul id="tray-items"></ul>
    <button id="open-compare" type="button" class="primary"></button>
  </div>
</div>

<dialog id="detail" aria-labelledby="detail-title">
  <button type="button" class="ghost close" data-close data-i18n="close">Close</button>
  <div id="detail-body"></div>
</dialog>

<dialog id="compare" class="wide-dialog">
  <div class="dialog-head">
    <h2 data-i18n="compare_title">Comparison</h2>
    <label class="check"><input type="checkbox" id="only-diff"> <span data-i18n="show_differences">Only differences</span></label>
    <button type="button" class="ghost close" data-close data-i18n="close">Close</button>
  </div>
  <div id="compare-body"></div>
</dialog>

<section id="sources" class="wrap sources" aria-labelledby="sources-title">
  <h2 id="sources-title" data-i18n="sources_title">Where the data comes from</h2>
  <p class="muted" data-i18n="sources_intro"></p>
  <div class="table-scroll"><table id="sources-table" class="specs"></table></div>
</section>

<footer class="wrap foot">
  <p id="updated"></p>
  <p><span data-i18n="footer"></span> <a href="https://github.com/UyttenhoveSimon/printers-list">GitHub</a></p>
</footer>
</body>
</html>
