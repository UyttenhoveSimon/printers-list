# Run with prek (a faster drop-in for pre-commit, installed by `uv sync`):
#   uv run prek install            # once, to run the hooks on every commit
#   uv run prek run --all-files    # what CI runs
# the catalogue is rewritten by the weekly job, the fixtures are captures:
# both are kept as written
exclude: ^(data|tests/fixtures)/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
