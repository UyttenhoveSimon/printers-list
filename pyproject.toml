[project]
name = "printers-list"
version = "0.1.0"
description = "A filterable list of the home and small-office printers on sale, refreshed every week."
authors = [{ name = "Simon Uyttenhove" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "defusedxml>=0.7.1",
    "requests>=2.32",
]

[project.scripts]
printers = "printers.cli:main"

[dependency-groups]
dev = [
    "prek>=0.5.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # the formatter owns trailing commas
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",  # docstrings where they explain something, not on every name
    "D401",    # docstrings describe as often as they command
    "CPY001",  # the licence lives in LICENSE
    "TRY003", "EM101", "EM102",  # error messages are written where they are raised
    "G004",    # logging uses f-strings; nothing logs hot enough to matter
    "TID252",  # sibling imports within the package are relative by design
    "TC001", "TC003",  # imports used in annotations stay plain; nothing heavy is imported
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",      # fixtures and fakes say what they are by name
    "S101",     # pytest asserts
    "PLR2004",  # expected values are the point of a test
    "ARG",      # fakes match the signature they replace
    "INP001",   # tests are not a package
    "FBT",      # boolean fakes
    "SLF001",   # tests may look inside
]
"printers/sources/*.py" = [
    "ARG001",  # every source has the same discover() signature, used or not
]
"printers/cli.py" = [
    "T201",  # the console prints by definition
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
# the live checks are opt-in: `pytest -m live`
addopts = "-m 'not live'"
markers = ["live: hits the real manufacturer sites and Icecat over the network"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["printers"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.hatch.build.targets.wheel]
packages = ["printers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ty.environment]
python-version = "3.15"

[[tool.ty.overrides]]
# test doubles stand in for Fetcher and requests.Session by shape
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
