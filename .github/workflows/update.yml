name: update and deploy

# Every Monday: read the sources, look up only the printers not seen before,
# commit the catalogue, publish the site, then check the sources. A broken
# source never holds back the others; the last job fails, so it is reported.
# A push to the site or the data only republishes.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      max_lookups:
        description: "Icecat lookups allowed in this run"
        default: "4000"
  push:
    branches: [main]
    paths: ["site/**", "data/**", "printers/**"]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Update the catalogue
        env:
          ICECAT_USER: ${{ secrets.ICECAT_USER }}
          ICECAT_PASSWORD: ${{ secrets.ICECAT_PASSWORD }}
          ICECAT_KEY: ${{ secrets.ICECAT_KEY }}
        run: uv run printers update --max-lookups "${{ inputs.max_lookups || '4000' }}"
      - name: Commit the catalogue
        run: |
          # the weekly refresh is committed as the repository owner, not as a bot
          git config user.name "UyttenhoveSimon"
          git config user.email "3716879+UyttenhoveSimon@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "Refresh the printer catalogue"
            git push
          fi

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the update job may have pushed a commit after this run started
          ref: main
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: uv run printers build --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # the canary: fails the run when a source that used to answer stopped
  check:
    needs: [update, deploy]
    if: always() && needs.update.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: uv run printers check
