name: update and deploy

# Every Monday: read the sources, look up only the printers not seen before,
# commit the catalogue, publish the site, then check the sources. A broken
# source never holds back the others; the last job fails, so it is reported.
# A push to the site or the data only republishes.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      max_lookups:
        description: "Icecat lookups allowed in this run"
        default: "4000"
      max_pages:
        description: "Maker pages read per source in this run (raise it to re-read them all)"
        default: "400"
  push:
    branches: [main]
    paths: ["site/**", "data/**", "printers/**"]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # five makers' sites at a polite pace, two of them through Chromium
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      # HP's and Canon's sites answer browsers only
      - run: uv run python -m rustwright install chromium
      - name: Update the catalogue
        env:
          ICECAT_USER: ${{ secrets.ICECAT_USER }}
          ICECAT_PASSWORD: ${{ secrets.ICECAT_PASSWORD }}
          ICECAT_KEY: ${{ secrets.ICECAT_KEY }}
          # via env, not inlined in the script, so an input can't inject shell code
          MAX_LOOKUPS: ${{ inputs.max_lookups || '4000' }}
          MAX_PAGES: ${{ inputs.max_pages || '400' }}
        run: >-
          uv run printers update
          --max-lookups "$MAX_LOOKUPS"
          --max-pages "$MAX_PAGES"
      - name: Commit the catalogue
        env:
          GH_TOKEN: ${{ github.token }} # checkout keeps no credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "Refresh the printer catalogue"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD
          fi

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the update job may have pushed a commit after this run started
          ref: main
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: uv run printers build --out _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # the canary: fails the run when a source that used to answer stopped
  check:
    needs: [update, deploy]
    if: always() && needs.update.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      # on the run's page too, each failing source with its first error
      - name: Check the sources
        shell: bash
        run: |
          status=0
          uv run printers check > check.txt 2>&1 || status=$?
          cat check.txt
          { echo '```'; cat check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
